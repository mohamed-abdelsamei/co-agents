name: build-check

# Ensure the committed Claude plugin (dist/claude/) stays in sync with src/.
on:
  push:
    paths: ["src/**", "adapters/**", "dist/**"]
  pull_request:
    paths: ["src/**", "adapters/**", "dist/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build all targets (validates every adapter runs)
        run: python3 -m adapters
      - name: Verify committed plugin is in sync with src/
        run: python3 -m adapters claude --check

name: build-check

# Ensure dist/ is regenerated whenever the source or build changes.
on:
  push:
    paths: ["src/**", "adapters/**", "scripts/**", "dist/**"]
  pull_request:
    paths: ["src/**", "adapters/**", "scripts/**", "dist/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify dist/ is in sync with src/
        run: python3 scripts/build.py --check

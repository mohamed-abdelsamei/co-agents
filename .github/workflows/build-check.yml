name: build-check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build (generates CLAUDE.md + dist/copilot)
        run: python3 build.py

      - name: CLAUDE.md is in sync with the doctrine source
        # CLAUDE.md is generated from conductors/ + shared/doctrine/. If this fails,
        # someone edited CLAUDE.md by hand or forgot to run build.py and commit the result.
        run: git diff --exit-code -- CLAUDE.md

      - name: Validate manifests, frontmatter, and include expansion
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          problems = []

          # Plugin manifests must be valid JSON.
          for f in [".claude-plugin/plugin.json", ".claude-plugin/marketplace.json"]:
              try:
                  json.load(open(f))
              except Exception as e:
                  problems.append(f"{f}: invalid JSON ({e})")

          dist = pathlib.Path("dist/copilot")

          # Every generated agent/prompt/instructions file needs frontmatter with a description
          # (instructions files use applyTo), and no unexpanded include markers anywhere.
          for f in dist.rglob("*.md"):
              text = f.read_text()
              if "<!-- include:" in text:
                  problems.append(f"{f}: unexpanded include marker")
              top = str(f.relative_to(dist)).split("/")[0]
              if top in ("agents", "prompts", "instructions"):
                  if not text.startswith("---\n") or "\n---" not in text:
                      problems.append(f"{f}: missing frontmatter")
                      continue
                  fm = text[4:text.index("\n---", 4)]
                  if top in ("agents", "prompts") and "description:" not in fm:
                      problems.append(f"{f}: frontmatter missing description")

          if problems:
              print("FAIL:")
              for p in problems:
                  print("  -", p)
              sys.exit(1)
          print("OK: manifests, frontmatter, and includes all valid")
          PY

      - name: No tool-specific orchestration leaked into canonical commands
        # Canonical commands must stay tool-neutral (Claude-specific mechanics live only in
        # conductors/CLAUDE.template.md). Catch regressions like "spawn ... via the Agent tool".
        run: |
          if grep -rniE 'spawn|subagent|agent tool' commands/; then
            echo "::error::canonical command contains Claude-only orchestration wording (keep commands tool-neutral)"
            exit 1
          fi
          echo "OK: commands are tool-neutral"
